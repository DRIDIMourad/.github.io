site_name: Mourad DRIDI
site_url: https://votrepseudo.github.io/
site_description: Mourad DRIDI, enseignant-chercheur à ESIEE Paris (DISC) et au LIGM (équipe LRT)
copyright: © Mourad DRIDI

repo_url: https://github.com/votrepseudo/votrepseudo.github.io
repo_name: Git

theme:
  name: material
  language: fr
  logo: assets/photo.svg
  favicon: assets/photo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mode clair
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs          # onglets "Recherche" / "Enseignements" en haut
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/git-alt

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.com/citations?user=CFmoyZIAAAAJ&hl=fr
      name: Google Scholar
    - icon: material/email
      link: mailto:mourad.dridi@univ-eiffel.fr
      name: E-mail

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Accueil: index.md
  - Recherche:
      - research/index.md
      - NPSIM: research/npsim.md
      - Projets: research/projets.md
      - Stages encadrés: research/encadrement.md
  - Enseignements:
      - units/index.md
      - UE exemple:
          - units/ue-exemple/index.md
          - TP1: units/ue-exemple/tp/tp1.md
